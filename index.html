<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Guía Completa de Ejercicios Gym</title>
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --accent-color: #38bdf8;
      --warning-color: #f87171;
      --success-color: #4ade80;
      --border-color: #334155;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      padding: 20px;
    }

    header {
      text-align: center;
      max-width: 1200px;
      margin: 0 auto 30px auto;
    }

    h1 {
      font-size: 2rem;
      margin-bottom: 8px;
    }

    p {
      color: var(--text-muted);
    }

    .search-container {
      margin-top: 20px;
      display: flex;
      flex-direction: column;
      gap: 15px;
      align-items: center;
    }

    #searchInput {
      width: 100%;
      max-width: 500px;
      padding: 12px 20px;
      border-radius: 25px;
      border: 1px solid var(--border-color);
      background-color: var(--card-bg);
      color: var(--text-main);
      font-size: 1rem;
      outline: none;
    }

    #searchInput:focus {
      border-color: var(--accent-color);
    }

    .filter-buttons {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: center;
    }

    .filter-btn {
      background-color: var(--card-bg);
      color: var(--text-muted);
      border: 1px solid var(--border-color);
      padding: 8px 16px;
      border-radius: 20px;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .filter-btn.active, .filter-btn:hover {
      background-color: var(--accent-color);
      color: #000;
      border-color: var(--accent-color);
      font-weight: bold;
    }

    .exercise-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 20px;
      max-width: 1400px;
      margin: 0 auto;
    }

    .card {
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      position: relative;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3);
    }

    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .card-number {
      background-color: var(--border-color);
      color: var(--accent-color);
      font-weight: bold;
      padding: 4px 8px;
      border-radius: 8px;
      font-size: 0.85rem;
    }

    .card-title {
      font-size: 1.15rem;
      font-weight: bold;
      color: var(--text-main);
      margin-top: 5px;
    }

    .card-section {
      font-size: 0.9rem;
      line-height: 1.4;
    }

    .card-section.recommendation {
      color: var(--success-color);
    }

    .card-section.warning {
      color: var(--warning-color);
      background-color: rgba(248, 113, 113, 0.1);
      padding: 8px;
      border-radius: 8px;
    }
  </style>
</head>
<body>
  <header>

        <button class="filter-btn" data-category="TRÍCEPS">Tríceps</button>
        <button class="filter-btn" data-category="CUÁDRICEPS">Cuádriceps</button>
        <button class="filter-btn" data-category="ISQUIOS">Isquios y Glúteos</button>
        <button class="filter-btn" data-category="GEMELOS">Gemelos</button>
        <button class="filter-btn" data-category="CORE">Core</button>
        <button class="filter-btn" data-category="CARDIO">Cardio</button>
      </div>
    </div>
  </header>

  <main>
    <div id="exerciseGrid" class="exercise-grid"></div>
  </main>

    const grid = document.getElementById("exerciseGrid");
    const searchInput = document.getElementById("searchInput");
    const categoryButtons = document.querySelectorAll(".filter-btn");

    let currentCategory = "ALL";

    function renderExercises() {
      grid.innerHTML = "";
      const query = searchInput.value.toLowerCase().trim();

      const filtered = exercises.filter(ex => {
        const matchesCategory = currentCategory === "ALL" || ex.category === currentCategory;
        const matchesSearch = ex.name.toLowerCase().includes(query) || ex.category.toLowerCase().includes(query);
        return matchesCategory && matchesSearch;
      });

      if (filtered.length === 0) {
        grid.innerHTML = `<p style="grid-column: 1/-1; text-align: center; color: var(--text-muted); font-size: 1.1rem; padding: 40px 0;">No se encontraron ejercicios con ese criterio.</p>`;
        return;
      }

      filtered.forEach(ex => {
        const card = document.createElement("div");
        card.className = "card";
        card.innerHTML = `
          <div class="card-header">
            <span class="card-number">#${ex.id}</span>
            <span class="card-number">${ex.category}</span>
          </div>
          <h3 class="card-title">${ex.name}</h3>
          <div class="card-section">🎯 <strong>Ajustes:</strong> ${ex.adjustments}</div>
          <div class="card-section recommendation">💡 <strong>Recomendación:</strong> ${ex.recommendation}</div>
          <div class="card-section warning">⚠️ <strong>Error común:</strong> ${ex.error}</div>
        `;
        grid.appendChild(card);
      });
    }

    searchInput.addEventListener("input", renderExercises);

    categoryButtons.forEach(btn => {
      btn.addEventListener("click", () => {
        categoryButtons.forEach(b => b.classList.remove("active"));
        btn.classList.add("active");
        currentCategory = btn.dataset.category;
        renderExercises();
      });
    });

    renderExercises();
  </script>
